openapi: 3.1.0
info:
  title: CareBridge API
  version: 0.2.0
  description: >-
    Coordinated access to verified healthcare capacity in Lagos (dental pilot).
    Manages care requests, clinic offers, appointment slots, clinical referrals,
    cost estimates, clinical documents, and Paystack payments.
servers:
  - url: /api/v1
    description: API v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: API is operational
  /auth/register:
    post:
      summary: Register account (patient or provider staff, optionally with clinic details)
      responses:
        '201':
          description: Account created (clinic sign-ups start pending verification)
        '409':
          description: Email, phone or registration number already registered
  /providers/{id}/team:
    get:
      summary: List a clinic's team members
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Members with role and account status
    post:
      summary: Add or re-role a team member (clinic owner, verified facility)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Member added
        '409':
          description: PROVIDER_NOT_VERIFIED, NOT_PROVIDER_STAFF, ACCOUNT_SUSPENDED or SELF_CHANGE
  /providers/{id}/team/{userId}:
    delete:
      summary: Remove a team member (clinic owner, verified facility)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Member removed
        '409':
          description: OWNER_CHANGE_FORBIDDEN or SELF_CHANGE
  /staff-accounts:
    get:
      summary: Search provider-staff accounts a clinic owner may invite
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Matching staff accounts (id, name, email, status)
  /auth/login:
    post:
      summary: Authenticate and receive JWT
      responses:
        '200':
          description: Sign in successful
  /requests:
    post:
      summary: Submit a care request (optionally directed at one clinic)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Care request created, or accepted by the chosen clinic
        '404':
          description: Chosen clinic cannot take this request; nothing stored
        '422':
          description: Emergency redirect guidance
  /requests/{id}/matches:
    get:
      summary: Intelligent matching score breakdown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ranked matching providers
  /providers/{id}/slots:
    get:
      summary: List available capacity slots
      responses:
        '200':
          description: Slots list
    post:
      summary: Create slot
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Slot created
  /requests/{id}/referrals:
    post:
      summary: Create specialist referral (after the patient has been seen)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Referral sent
        '409':
          description: VISIT_REQUIRED
    get:
      summary: List referrals for request
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Referral records
  /requests/{id}/estimates:
    post:
      summary: Issue cost estimate (after the patient has been seen)
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Estimate issued
        '409':
          description: VISIT_REQUIRED
    get:
      summary: List estimates for request
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Estimate records
  /requests/{id}/documents/upload-url:
    post:
      summary: Generate pre-signed upload URL for clinical photo/X-ray
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pre-signed upload parameters
  /requests/{id}/payments/initialize:
    post:
      summary: Initialize payment via Paystack or mock gateway
      security:
        - bearerAuth: []
      responses:
        '201':
          description: Checkout authorization URL
  /admin/stuck-requests:
    get:
      summary: Operator SLA monitoring dashboard
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Breached and warning requests
  /admin/audit-logs:
    get:
      summary: Audit log inspection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit log stream
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
